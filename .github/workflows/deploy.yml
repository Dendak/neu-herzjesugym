# Baut die Website bei jedem Push auf main und veröffentlicht dist/ im Branch gh-pages
# (GitHub Pages, legacy, eigene Domain). Gleiche Schritte wie scripts/deploy.sh neu.herzjesugym.com.
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'CLAUDE.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /
      - name: dist/ nach gh-pages pushen
        working-directory: dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo neu.herzjesugym.com > CNAME
          git init -b gh-pages -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "deploy $(date -u +%Y-%m-%dT%H:%MZ) neu.herzjesugym.com (${GITHUB_SHA::7})"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
